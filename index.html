<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 기반 기부 플랫폼</title>
    <style>
        body {
            font-family: sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
        }
        #data-display {
            margin-top: 20px;
            padding: 15px;
            background: #ecf0f1;
            border-left: 5px solid #3498db;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI 기반 기부 플랫폼</h1>
        <p>AI와 전문가의 협업으로 가장 효율적인 기부를 실행합니다.</p>

        <div id="data-display">
            <h2>분석 데이터</h2>
            <p>AI 애널리스트의 분석 데이터가 이곳에 표시됩니다.</p>
            <!-- 향후 데이터가 동적으로 여기에 삽입됩니다. -->
        </div>

        <div id="decision-panel" style="margin-top: 30px;">
            <h2>전문가 결정 패널</h2>
            <p>데이터를 기반으로 한 최종 투자 결정이 이곳에서 이루어집니다.</p>
            <!-- 향후 전문가용 입력 폼이 여기에 추가됩니다. -->
        </div>
    </div>
</body>
</html>
