<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Simple, modern logo representing data-driven donation -->
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Bar chart element -->
    <rect x="15" y="60" width="20" height="30" rx="3" fill="url(#grad1)"/>
    <rect x="40" y="40" width="20" height="50" rx="3" fill="url(#grad1)"/>
    <rect x="65" y="20" width="20" height="70" rx="3" fill="url(#grad1)"/>

    <!-- Plus/Heart element representing care/donation -->
    <g transform="translate(5, 5)">
      <path d="M 10,25 A 20,20 0,0,1 50,25 A 20,20 0,0,1 90,25 Q 90,65 50,95 Q 10,65 10,25 z" fill="#2ecc71" opacity="0.85"/>
    </g>
    <text x="50" y="85" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Impact</text>
</svg>
