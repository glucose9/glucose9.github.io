<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 기반 기부 플랫폼</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>AI 기반 기부 플랫폼</h1>
        <p>AI와 전문가의 협업으로 가장 효율적인 기부를 실행합니다.</p>

        <div id="data-display">
            <h2>분석 데이터</h2>
            <p>AI 애널리스트의 분석 데이터가 이곳에 표시됩니다.</p>
        </div>

        <div id="decision-panel" style="margin-top: 30px; text-align: left;">
            <h2>전문가 결정 패널</h2>
            <form id="portfolio-form">
                <div id="portfolio-entries">
                    <div class="portfolio-entry">
                        <input type="text" placeholder="자선단체 이름" class="charity-name" required>
                        <input type="number" placeholder="비율 (%)" class="allocation" min="0" max="100" required>
                    </div>
                </div>
                <button type="button" id="add-entry-btn">+ 항목 추가</button>
                <button type="submit" id="submit-portfolio-btn">포트폴리오 승인</button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
